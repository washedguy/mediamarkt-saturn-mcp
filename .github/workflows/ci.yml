name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check Python syntax
        run: uv run --locked python -m compileall -q mediamarkt_mcp

      - name: Lint
        run: uv run --locked ruff check mediamarkt_mcp tests

      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test built wheel
        working-directory: ${{ runner.temp }}
        run: uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python -m mediamarkt_mcp --help
